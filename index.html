<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>my snowglobe</title>
        <link rel="stylesheet" href="style.css"/>
    </head>
    <body>
        <header class="big-boy">
            <h1>this is my snowglobe</h1>
            <p class="tagline">shake it for some magic</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="snowglobe.png" alt="a snowglobe">
                </div>
                <button id=""shake">shake the globe</button>
                <p class="message" id="message">press the button and see what settles</p>
            </section>
        </main>
        <footer>
            <p>made by me, in the snow</p>
        </footer>
    </body>
</html>
