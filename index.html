<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>my lightyagami globe</title>
        <link rel="stylesheet" href="style.css"/>
        <link href="https://fonts.cdnfonts.com/css/death-note-font" rel="stylesheet">
    </head>
    <body>
        <header class="big-boy">
            <h1>this is my light yagami globe</h1>
            <p class="tagline">shake it for some magic</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="lightyagamisnowglobe.png" alt="a snowglobe">
                </div>
                <button id="shake">shake him</button>
                <p class="message" id="message">press the button and see what settles</p>
            </section>
        </main>
        <footer>
        </footer>
        <script src="script.js"></script>
    </body>
</html>
