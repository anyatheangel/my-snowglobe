<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <title>my lightyagami globe</title>
        <link rel="stylesheet" href="style.css"/>
        <audio id="bg-music" src="death-note.mp3" autoplay loop></audio>
    </head>
    <body>
        <header class="big-boy">
            <h1>this is my light yagami globe</h1>
            <p class="tagline">shake it for some magic</p>
        </header>
        <main>
            <section class="globe-card">
                <div class="globe" id="globe">
                    <img class="scene" src="lightyagamisnowglobe.PNG" alt="a snowglobe">
                </div>
                <button id="shake">shake him</button>
                <p class="message audio" id="message">press the button for god's wisdom.</p>
            </section>
        </main>
        <script src="script.js"></script>
        <footer>
            <p>made with the help of a snowglobe guide!!</p>
        </footer>
    </body>
</html>
